name: Desktop (Tauri build, Windows)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "engine/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "index.html"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Stage 3a: build the JUCE engine sidecar BEFORE tauri build, so the
      # exe can be placed in src-tauri/binaries/ for the bundler to pick up.
      # Stage 3b-fix: NO SCORCH_ENGINE_AUDIO=OFF — audio is ALWAYS compiled in.
      # The old compile gate shipped mute installers (the user's by-ear gate
      # failed by construction); headless safety is now runtime-lazy-init.
      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Setup MSVC developer environment
        uses: seanmiddleditch/gha-setup-vsdevenv@v4

      - name: Cache JUCE + IXWebSocket FetchContent
        uses: actions/cache@v4
        with:
          path: engine/build/_fetch
          key: engine-fetch-${{ runner.os }}-${{ hashFiles('engine/CMakeLists.txt') }}
          restore-keys: |
            engine-fetch-${{ runner.os }}-

      - name: Configure + build engine (CMake + MSVC)
        shell: pwsh
        run: |
          cmake -S engine -B engine/build -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          cmake --build engine/build --parallel
          if (-not (Test-Path "engine/build/scorch-engine.exe")) {
            throw "scorch-engine.exe not found after build"
          }
          # Stage 3c-1: also build the free stand-in host target ("Scorch Test
          # Synth") — the CI fixture for scan + hosting tests (commercial
          # libraries like BBCSO cannot run in CI).
          cmake --build engine/build --target scorch-test-synth_VST3 --parallel
          New-Item -ItemType Directory -Path src-tauri/binaries -Force | Out-Null
          Copy-Item engine/build/scorch-engine.exe src-tauri/binaries/scorch-engine.exe -Force
          Write-Host "Engine exe copied to src-tauri/binaries/"

      - name: Build scan fixtures (test VST3 + crash dummy + corrupt dummy)
        shell: pwsh
        run: |
          # Fixture dir for the 3c-1 scan-protocol test.
          $fx = Join-Path $env:RUNNER_TEMP "scan-fixtures"
          New-Item -ItemType Directory -Path $fx -Force | Out-Null

          # 1. Valid: the built Scorch Test Synth VST3 bundle.
          $vst3 = Get-ChildItem -Path "engine/build/testvst" -Recurse -Filter "*.vst3" |
            Where-Object { $_.PSIsContainer } | Select-Object -First 1
          if (-not $vst3) { throw "Scorch Test Synth .vst3 bundle not found under engine/build/testvst" }
          Copy-Item -Recurse $vst3.FullName (Join-Path $fx $vst3.Name)
          Write-Host "Valid fixture: $($vst3.Name)"

          # 2. Crash dummy: a VALID shared library whose GetPluginFactory
          #    aborts — kills its scan-worker child (crash isolation proof).
          $crashDir = Join-Path $fx "CrashDummy.vst3\Contents\x86_64-win"
          New-Item -ItemType Directory -Path $crashDir -Force | Out-Null
          cl /nologo /LD engine\testvst\crashvst.c /Fe:"$crashDir\CrashDummy.vst3"
          if (-not (Test-Path "$crashDir\CrashDummy.vst3")) { throw "crash dummy build failed" }
          Write-Host "Crash fixture built"

          # 3. Corrupt dummy: garbage bytes (graceful zero-type load failure).
          $corruptDir = Join-Path $fx "CorruptDummy.vst3\Contents\x86_64-win"
          New-Item -ItemType Directory -Path $corruptDir -Force | Out-Null
          [System.IO.File]::WriteAllBytes("$corruptDir\CorruptDummy.vst3", [System.Text.Encoding]::ASCII.GetBytes("this is not a PE module — garbage"))
          Write-Host "Corrupt fixture written"
          "SCAN_FIXTURES=$fx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Engine standalone protocol test (null-audio + graceful no-device + scan + host + real-scale paths)
        shell: pwsh
        run: |
          # Gate-absence proof: the binary itself reports "audio: built-in".
          # A compile-gated (mute) build cannot print this.
          $versionOut = & "engine/build/scorch-engine.exe" --version
          Write-Host "Version output: $versionOut"
          if ($versionOut -notmatch "scorch-engine 0\.3\.0") { throw "Version check failed: $versionOut" }
          if ($versionOut -notmatch "audio: built-in") { throw "Audio compile gate still present — engine reports no audio support" }

          # Stage 3c-hotfix: start the protocol-test step with a CLEAN
          # engine.log so the receipt assertions in Test E prove THIS run
          # wrote its receipts.
          Remove-Item (Join-Path $env:APPDATA "scorch\engine.log") -ErrorAction SilentlyContinue

          # Test A — --null-audio: JUCE null device, no hardware. The graph runs
          # in real time: transport play SUCCEEDS, state ticks ADVANCE, stop works.
          # Stage 3b polish RESUME contract: play(tick 480) starts at ~480 (NOT 0),
          # stop KEEPS the position, play WITHOUT tick RESUMES from it (NOT 0).
          Write-Host "=== Test A: --null-audio (play(480) -> ticks advance -> stop -> resume -> ticks advance) ==="
          $procA = Start-Process -FilePath "engine/build/scorch-engine.exe" -ArgumentList "--port","9378","--null-audio" -PassThru -NoNewWindow -RedirectStandardOutput "engine-a-stdout.txt" -RedirectStandardError "engine-a-stderr.txt"
          Start-Sleep -Seconds 3
          try {
            if ($procA.HasExited) {
              Write-Host "Engine A exited early (code=$($procA.ExitCode)). stdout:"
              if (Test-Path engine-a-stdout.txt) { Get-Content engine-a-stdout.txt }
              Write-Host "stderr:"
              if (Test-Path engine-a-stderr.txt) { Get-Content engine-a-stderr.txt }
              throw "Engine A process exited before test could connect"
            }
            node .github/scripts/test-engine-protocol.mjs 9378 null-audio
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Engine A stdout:"
              if (Test-Path engine-a-stdout.txt) { Get-Content engine-a-stdout.txt }
              Write-Host "Engine A stderr:"
              if (Test-Path engine-a-stderr.txt) { Get-Content engine-a-stderr.txt }
              throw "Engine A null-audio protocol test failed"
            }
            # Stage 3c close-out — MUSICAL RELEASE proof from the engine's own
            # stdout: the stop handler reports the musical release (voices
            # releasing + plugin note-offs), NOT an instant kill. Missing line
            # = the transport-transition semantics regressed.
            $killProof = Select-String -Path "engine-a-stdout.txt" -Pattern "musical release"
            if (-not $killProof) { throw "stop musical-release proof missing: 'musical release' not in engine stdout" }
            Write-Host "Musical-release proof: $($killProof.Line)"
            $reattackProof = Select-String -Path "engine-a-stdout.txt" -Pattern "re-attacks"
            if (-not $reattackProof) { throw "resume re-attack proof missing: no 're-attacks' in engine stdout (straddle handling regressed)" }
            Write-Host "Resume re-attack proof: $($reattackProof.Line)"
            $resumeProof = Select-String -Path "engine-a-stdout.txt" -Pattern "transport play from tick"
            if (-not $resumeProof) { throw "resume proof missing: no 'transport play from tick' lines in engine stdout" }
            foreach ($l in $resumeProof.Line) { Write-Host "Resume proof: $l" }
            # shutdown -> clean exit 0. A 0xC0000005 would surface as a
            # negative/negative-hex exit code and fail this check.
            $procA.WaitForExit(10000) | Out-Null
            if (-not $procA.HasExited -or $procA.ExitCode -ne 0) { throw "Engine A did not exit cleanly (code=$($procA.ExitCode))" }
            Write-Host "Engine A clean exit 0"
          } finally {
            Stop-Process -Id $procA.Id -Force -ErrorAction SilentlyContinue
          }

          # Test B — NO flag on a headless runner: lazy audio init finds no
          # device, transport play returns the graceful no_audio_device error
          # (the historical 0xC0000005 crash is now a clean protocol reply),
          # and the engine stays protocol-functional afterwards.
          Write-Host "=== Test B: no flag (play -> graceful no_audio_device error, no crash) ==="
          $procB = Start-Process -FilePath "engine/build/scorch-engine.exe" -ArgumentList "--port","9379" -PassThru -NoNewWindow -RedirectStandardOutput "engine-b-stdout.txt" -RedirectStandardError "engine-b-stderr.txt"
          Start-Sleep -Seconds 3
          try {
            if ($procB.HasExited) {
              Write-Host "Engine B exited early (code=$($procB.ExitCode)). stdout:"
              if (Test-Path engine-b-stdout.txt) { Get-Content engine-b-stdout.txt }
              Write-Host "stderr:"
              if (Test-Path engine-b-stderr.txt) { Get-Content engine-b-stderr.txt }
              throw "Engine B process exited before test could connect"
            }
            node .github/scripts/test-engine-protocol.mjs 9379 no-device
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Engine B stdout:"
              if (Test-Path engine-b-stdout.txt) { Get-Content engine-b-stdout.txt }
              Write-Host "Engine B stderr:"
              if (Test-Path engine-b-stderr.txt) { Get-Content engine-b-stderr.txt }
              throw "Engine B no-device graceful-error test failed"
            }
            $procB.WaitForExit(10000) | Out-Null
            if (-not $procB.HasExited -or $procB.ExitCode -ne 0) { throw "Engine B did not exit cleanly (code=$($procB.ExitCode))" }
            Write-Host "Engine B clean exit 0 (headless crash path is gone)"
          } finally {
            Stop-Process -Id $procB.Id -Force -ErrorAction SilentlyContinue
          }

          Write-Host "All engine protocol tests passed (audio-capable build, graceful headless behavior)"

          # Test C — Stage 3c-1 VST3 scan protocol: valid plugin found (real
          # name + vendor), CRASH-ISOLATION (worker dies → failed entry, scan
          # + engine survive), corrupt .vst3 graceful, default-dir scan clean.
          Write-Host "=== Test C: VST3 scan protocol + crash isolation ==="
          $procC = Start-Process -FilePath "engine/build/scorch-engine.exe" -ArgumentList "--port","9380" -PassThru -NoNewWindow -RedirectStandardOutput "engine-c-stdout.txt" -RedirectStandardError "engine-c-stderr.txt"
          Start-Sleep -Seconds 3
          try {
            if ($procC.HasExited) {
              Write-Host "Engine C exited early (code=$($procC.ExitCode)). stdout:"
              if (Test-Path engine-c-stdout.txt) { Get-Content engine-c-stdout.txt }
              throw "Engine C process exited before test could connect"
            }
            node .github/scripts/test-engine-protocol.mjs 9380 scan "$env:SCAN_FIXTURES"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Engine C stdout:"
              if (Test-Path engine-c-stdout.txt) { Get-Content engine-c-stdout.txt }
              Write-Host "Engine C stderr:"
              if (Test-Path engine-c-stderr.txt) { Get-Content engine-c-stderr.txt }
              throw "Engine C scan-protocol test failed"
            }
            # The scan summary must be in the engine's own stdout.
            $scanProof = Select-String -Path "engine-c-stdout.txt" -Pattern "\[engine\] scan: "
            if (-not $scanProof) { throw "scan proof missing: no '[engine] scan:' lines in engine stdout" }
            foreach ($l in $scanProof.Line) { Write-Host "Scan proof: $l" }
            $procC.WaitForExit(10000) | Out-Null
            if (-not $procC.HasExited -or $procC.ExitCode -ne 0) { throw "Engine C did not exit cleanly (code=$($procC.ExitCode))" }
            Write-Host "Engine C clean exit 0 (scan + crash isolation verified)"
          } finally {
            Stop-Process -Id $procC.Id -Force -ErrorAction SilentlyContinue
          }

          # Test D — Stage 3c-2 HOSTING: load the free test VST3 by uid+path,
          # prove over the wire: plugin_state loaded (latency<100ms), UACC
          # pre-trigger arithmetic (CC#32 exactly 38 ticks ≈ 20ms before its
          # note, sample-accurate), channel routing (ch1+ch2 dispatched AND
          # received by the plugin — the [testvst] stdout log), AUDIBLE
          # mute/solo gating (peaks: unmuted > 0, muted = 0, gated note never
          # dispatched, unmute restores). Stage 3c close-out: MUSICAL stops
          # (release marker + exact held-note offs, NO CC120), resume with
          # gentle re-attacks + UACC articulation suppression of redundant
          # CC#32 sends.
          Write-Host "=== Test D: VST3 hosting + channel routing + audible gating ==="
          $env:SCORCH_TESTVST_LOG = "1"
          $procD = Start-Process -FilePath "engine/build/scorch-engine.exe" -ArgumentList "--port","9381","--null-audio" -PassThru -NoNewWindow -RedirectStandardOutput "engine-d-stdout.txt" -RedirectStandardError "engine-d-stderr.txt"
          Start-Sleep -Seconds 3
          try {
            if ($procD.HasExited) {
              Write-Host "Engine D exited early (code=$($procD.ExitCode)). stdout:"
              if (Test-Path engine-d-stdout.txt) { Get-Content engine-d-stdout.txt }
              throw "Engine D process exited before test could connect"
            }
            node .github/scripts/test-engine-protocol.mjs 9381 host "$env:SCAN_FIXTURES"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Engine D stdout:"
              if (Test-Path engine-d-stdout.txt) { Get-Content engine-d-stdout.txt }
              Write-Host "Engine D stderr:"
              if (Test-Path engine-d-stderr.txt) { Get-Content engine-d-stderr.txt }
              throw "Engine D hosting test failed"
            }
            # END-TO-END routing proof from the PLUGIN's own stdout: the hosted
            # plugin received the dispatched notes on BOTH hosted channels.
            $ch2Note = Select-String -Path "engine-d-stdout.txt" -Pattern "\[testvst\].*ch=2 k=NOTE_ON"
            if (-not $ch2Note) { throw "channel routing proof missing: plugin never received a ch=2 NOTE_ON" }
            Write-Host "Plugin-side routing proof: $($ch2Note.Line[0])"
            $pluginLoaded = Select-String -Path "engine-d-stdout.txt" -Pattern "\[engine\] plugin loaded: name=Scorch Test Synth"
            if (-not $pluginLoaded) { throw "plugin-loaded proof missing from engine stdout" }
            foreach ($l in $pluginLoaded.Line) { Write-Host "Hosting proof: $l" }
            $procD.WaitForExit(10000) | Out-Null
            if (-not $procD.HasExited -or $procD.ExitCode -ne 0) { throw "Engine D did not exit cleanly (code=$($procD.ExitCode))" }
            Write-Host "Engine D clean exit 0 (hosting + routing + gating verified)"
          } finally {
            Stop-Process -Id $procD.Id -Force -ErrorAction SilentlyContinue
            Remove-Item Env:\SCORCH_TESTVST_LOG -ErrorAction SilentlyContinue
          }

          # Test E — Stage 3c-hotfix: REAL-PROJECT-SIZED load. The CI gap was
          # scale; this closes it: a deterministic 13,824-event (~1.1 MB)
          # fixture is sent as ONE load message and the loadAck receipt must
          # round-trip exactly (received == loaded == sent, byteSize == bytes
          # sent), non-array events must be REJECTED (bad_load — the silent
          # empty-score path that shipped the regression), and a malformed
          # event must be NAMED. Then the engine.log receipts themselves are
          # asserted — the same log the user can pull from their machine.
          Write-Host "=== Test E: scale (13,824-event load -> loadAck receipt round-trip -> negative paths) ==="
          $procE = Start-Process -FilePath "engine/build/scorch-engine.exe" -ArgumentList "--port","9382","--null-audio" -PassThru -NoNewWindow -RedirectStandardOutput "engine-e-stdout.txt" -RedirectStandardError "engine-e-stderr.txt"
          Start-Sleep -Seconds 3
          try {
            if ($procE.HasExited) {
              Write-Host "Engine E exited early (code=$($procE.ExitCode)). stdout:"
              if (Test-Path engine-e-stdout.txt) { Get-Content engine-e-stdout.txt }
              Write-Host "stderr:"
              if (Test-Path engine-e-stderr.txt) { Get-Content engine-e-stderr.txt }
              throw "Engine E process exited before test could connect"
            }
            node .github/scripts/test-engine-protocol.mjs 9382 scale
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Engine E stdout:"
              if (Test-Path engine-e-stdout.txt) { Get-Content engine-e-stdout.txt }
              Write-Host "Engine E stderr:"
              if (Test-Path engine-e-stderr.txt) { Get-Content engine-e-stderr.txt }
              throw "Engine E scale protocol test failed"
            }
            $procE.WaitForExit(10000) | Out-Null
            if (-not $procE.HasExited -or $procE.ExitCode -ne 0) { throw "Engine E did not exit cleanly (code=$($procE.ExitCode))" }
            Write-Host "Engine E clean exit 0 (scale round-trip verified)"
          } finally {
            Stop-Process -Id $procE.Id -Force -ErrorAction SilentlyContinue
          }

          # Stage 3c-hotfix: assert the engine.log RECEIPTS exist — the black
          # box now writes down what it received and what it renders.
          Write-Host "=== engine.log receipts (the engine's view of the world) ==="
          $engineLog = Join-Path $env:APPDATA "scorch\engine.log"
          if (-not (Test-Path $engineLog)) { throw "engine.log missing at $engineLog — engine wrote no receipts" }
          Get-Content $engineLog | ForEach-Object { Write-Host $_ }
          $scaleReceipts = (Select-String -Path $engineLog -Pattern "\[load\] received \d+ bytes \| loaded 13,824 events").Count
          if ($scaleReceipts -lt 1) { throw "engine.log missing the scale load receipt (loaded 13,824 events)" }
          $playReceipts = (Select-String -Path $engineLog -Pattern "\[play\] rendering from tick \d+, [\d,]+ voices scheduled").Count
          if ($playReceipts -lt 1) { throw "engine.log missing the play receipt (rendering from tick X, N voices scheduled)" }
          $failReceipts = (Select-String -Path $engineLog -Pattern "\[load-fail\]").Count
          if ($failReceipts -lt 1) { throw "engine.log missing the negative-path receipt (load-fail)" }
          # Stage 3c-regression: async init + rolling-transport guard receipts
          # (Test D phase 1 stopped load + phase 6 stopped re-host = 2 each;
          # phase 8 same-plugin mid-play reuse; phase 9 plugin-change reject).
          $initReceipts = (Select-String -Path $engineLog -Pattern "\[plugin\] init started \(async\)").Count
          if ($initReceipts -lt 2) { throw "engine.log missing async plugin-init receipts (got $initReceipts, need 2)" }
          $loadedReceipts = (Select-String -Path $engineLog -Pattern "\[plugin\] loaded name=").Count
          if ($loadedReceipts -lt 2) { throw "engine.log missing plugin-loaded receipts (got $loadedReceipts, need 2)" }
          $reuseReceipts = (Select-String -Path $engineLog -Pattern "\[plugin\] reuse while playing").Count
          if ($reuseReceipts -lt 1) { throw "engine.log missing the mid-play reuse receipt (same-plugin fast path)" }
          $rejectReceipts = (Select-String -Path $engineLog -Pattern "\[load\] REJECTED while playing").Count
          if ($rejectReceipts -lt 1) { throw "engine.log missing the rolling-transport rejection receipt" }
          # Stage 3c-polish: D1 device-config receipts + F3 session peak.
          $audioReceipts = (Select-String -Path $engineLog -Pattern "\[audio\] opened device=").Count
          if ($audioReceipts -lt 3) { throw "engine.log missing [audio] opened receipts (got $audioReceipts, need 3: tests A+D+E)" }
          $preparedReceipts = (Select-String -Path $engineLog -Pattern "\[plugin\] prepared").Count
          if ($preparedReceipts -lt 3) { throw "engine.log missing [plugin] prepared receipts (got $preparedReceipts, need 3: AboutToStart + 2 async in test D)" }
          $peakReceipts = (Select-String -Path $engineLog -Pattern "session peak").Count
          if ($peakReceipts -lt 3) { throw "engine.log missing session-peak stop receipts (got $peakReceipts, need 3)" }
          # Stage 3c close-out: musical-release stop receipts + resume re-attack counts.
          $releaseReceipts = (Select-String -Path $engineLog -Pattern "\[stop\] transport stop — musical release").Count
          if ($releaseReceipts -lt 3) { throw "engine.log missing musical-release stop receipts (got $releaseReceipts, need 3)" }
          $reattackReceipts = (Select-String -Path $engineLog -Pattern "resume re-attacks: [1-9]").Count
          if ($reattackReceipts -lt 1) { throw "engine.log missing a resume re-attack receipt (straddle handling regressed)" }
          Write-Host "engine.log receipt assertions passed (scale load, play, load-fail, async init, reuse, rolling-transport reject, audio config, prepare config, session peak, musical release, resume re-attacks all present)"

      - run: npm ci

      - name: Build web (vite)
        run: npm run build

      - name: tsc --noEmit (gate)
        run: npx tsc --noEmit

      - name: Tauri build (msi + nsis + raw exe)
        run: npx tauri build

      - name: Create web-pack zip (manifest + dist/ at root)
        shell: pwsh
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $version = [int]$env:RUN_NUMBER
          $iso = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
          @{ version = $version; minShell = 1; generatedAt = $iso } |
            ConvertTo-Json -Compress |
            Out-File -FilePath manifest.json -Encoding utf8NoBOM
          Compress-Archive -Path dist\*, manifest.json -DestinationPath "web-pack-v$version.zip" -Force
          Write-Host "Created web-pack-v$version.zip"

      - name: Verify web-pack contents
        shell: pwsh
        run: |
          $zip = (Get-ChildItem web-pack-v*.zip)[0].FullName
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          $entries = $archive.Entries | ForEach-Object { $_.FullName }
          $archive.Dispose()
          if ($entries -notcontains "manifest.json") { throw "manifest.json missing from web-pack" }
          if ($entries -notcontains "index.html") { throw "index.html missing from web-pack" }
          Write-Host "web-pack entries: $($entries -join ', ')"
          $tmp = New-Item -ItemType Directory -Path web-pack-verify -Force
          Expand-Archive -Path $zip -DestinationPath $tmp -Force
          Get-Content "$tmp\manifest.json"

      - name: Upload web-pack (hot-swap tier)
        uses: actions/upload-artifact@v4
        with:
          name: web-pack
          path: web-pack-v*.zip
          retention-days: 14

      - name: Upload engine exe (sidecar)
        uses: actions/upload-artifact@v4
        with:
          name: scorch-engine-windows-exe
          path: engine/build/scorch-engine.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: scorch-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: scorch-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload raw scorch.exe
        uses: actions/upload-artifact@v4
        with:
          name: scorch-windows-exe
          path: src-tauri/target/release/scorch.exe
          if-no-files-found: error
          retention-days: 14
