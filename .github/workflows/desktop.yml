name: Desktop (Tauri build, Windows)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "engine/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "index.html"
      - ".github/workflows/desktop.yml"
      - ".github/scripts/**"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Stage 3a: build the JUCE engine sidecar BEFORE tauri build, so the
      # exe can be placed in src-tauri/binaries/ for the bundler to pick up.
      # Stage 3b-fix: NO SCORCH_ENGINE_AUDIO=OFF — audio is ALWAYS compiled in.
      # The old compile gate shipped mute installers (the user's by-ear gate
      # failed by construction); headless safety is now runtime-lazy-init.
      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Setup MSVC developer environment
        uses: seanmiddleditch/gha-setup-vsdevenv@v4

      - name: Cache JUCE + IXWebSocket FetchContent
        uses: actions/cache@v4
        with:
          path: engine/build/_fetch
          key: engine-fetch-${{ runner.os }}-${{ hashFiles('engine/CMakeLists.txt') }}
          restore-keys: |
            engine-fetch-${{ runner.os }}-

      - name: Configure + build engine (CMake + MSVC)
        shell: pwsh
        run: |
          cmake -S engine -B engine/build -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          cmake --build engine/build --parallel
          if (-not (Test-Path "engine/build/scorch-engine.exe")) {
            throw "scorch-engine.exe not found after build"
          }
          # Stage 3c-1: also build the free stand-in host target ("Scorch Test
          # Synth") — the CI fixture for scan + hosting tests (commercial
          # libraries like BBCSO cannot run in CI).
          cmake --build engine/build --target scorch-test-synth_VST3 --parallel
          New-Item -ItemType Directory -Path src-tauri/binaries -Force | Out-Null
          Copy-Item engine/build/scorch-engine.exe src-tauri/binaries/scorch-engine.exe -Force
          Write-Host "Engine exe copied to src-tauri/binaries/"

      - name: Build scan fixtures (test VST3 + crash dummy + corrupt dummy)
        shell: pwsh
        run: |
          # Fixture dir for the 3c-1 scan-protocol test.
          $fx = Join-Path $env:RUNNER_TEMP "scan-fixtures"
          New-Item -ItemType Directory -Path $fx -Force | Out-Null

          # 1. Valid: the built Scorch Test Synth VST3 bundle.
          $vst3 = Get-ChildItem -Path "engine/build/testvst" -Recurse -Filter "*.vst3" |
            Where-Object { $_.PSIsContainer } | Select-Object -First 1
          if (-not $vst3) { throw "Scorch Test Synth .vst3 bundle not found under engine/build/testvst" }
          Copy-Item -Recurse $vst3.FullName (Join-Path $fx $vst3.Name)
          Write-Host "Valid fixture: $($vst3.Name)"

          # 2. Crash dummy: a VALID shared library whose GetPluginFactory
          #    aborts — kills its scan-worker child (crash isolation proof).
          $crashDir = Join-Path $fx "CrashDummy.vst3\Contents\x86_64-win"
          New-Item -ItemType Directory -Path $crashDir -Force | Out-Null
          cl /nologo /LD engine\testvst\crashvst.c /Fe:"$crashDir\CrashDummy.vst3"
          if (-not (Test-Path "$crashDir\CrashDummy.vst3")) { throw "crash dummy build failed" }
          Write-Host "Crash fixture built"

          # 3. Corrupt dummy: garbage bytes (graceful zero-type load failure).
          $corruptDir = Join-Path $fx "CorruptDummy.vst3\Contents\x86_64-win"
          New-Item -ItemType Directory -Path $corruptDir -Force | Out-Null
          [System.IO.File]::WriteAllBytes("$corruptDir\CorruptDummy.vst3", [System.Text.Encoding]::ASCII.GetBytes("this is not a PE module — garbage"))
          Write-Host "Corrupt fixture written"

          # 4. Probe dummies (Stage 3f-2): their bundle carries a valid
          #    Contents/Resources/moduleinfo.json, so DESCRIBE succeeds on the
          #    fast path and NEVER loads the binary — but the binary fails
          #    when the PROBE actually loads it. ProbeHangDummy sleeps forever
          #    in GetPluginFactory (proves the 90 s probe timeout sends
          #    capabilitiesError without removing the row); ProbeCrashDummy
          #    aborts there (proves probe-crash isolation keeps the row) and
          #    lives in a nested subfolder tree, which doubles as the proof
          #    that the recursive scan finds plugins up to 4 levels deep.
          $probeSrc = "engine\testvst\probedummy.c"
          $hangBundle = Join-Path $fx "ProbeHangDummy.vst3"
          $hangBin = Join-Path $hangBundle "Contents\x86_64-win"
          New-Item -ItemType Directory -Path $hangBin -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $hangBundle "Contents\Resources") -Force | Out-Null
          cl /nologo /LD /DPROBE_HANG=1 $probeSrc /Fe:"$hangBin\ProbeHangDummy.vst3"
          if (-not (Test-Path "$hangBin\ProbeHangDummy.vst3")) { throw "probe hang dummy build failed" }
          Copy-Item engine\testvst\fixtures\probe-hang-moduleinfo.json (Join-Path $hangBundle "Contents\Resources\moduleinfo.json")
          Write-Host "Probe hang fixture built"

          $crashBundle = Join-Path $fx "nested\L1\L2\ProbeCrashDummy.vst3"
          $crashBin = Join-Path $crashBundle "Contents\x86_64-win"
          New-Item -ItemType Directory -Path $crashBin -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $crashBundle "Contents\Resources") -Force | Out-Null
          cl /nologo /LD $probeSrc /Fe:"$crashBin\ProbeCrashDummy.vst3"
          if (-not (Test-Path "$crashBin\ProbeCrashDummy.vst3")) { throw "probe crash dummy build failed" }
          Copy-Item engine\testvst\fixtures\probe-crash-moduleinfo.json (Join-Path $crashBundle "Contents\Resources\moduleinfo.json")
          Write-Host "Probe crash fixture built (nested 3 levels deep)"
          "SCAN_FIXTURES=$fx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Engine standalone protocol test (null-audio + graceful no-device + scan + host + real-scale paths)
        shell: pwsh
        run: |
          # Gate-absence proof: the binary itself reports "audio: built-in".
          # A compile-gated (mute) build cannot print this.
          $versionOut = & "engine/build/scorch-engine.exe" --version
          Write-Host "Version output: $versionOut"
          # Expected version is DERIVED from kEngineVersion in main.cpp, not
          # hardcoded — an engine version bump no longer needs a matching
          # workflow edit (the 0.4.0 bump broke this gate once), and a stale
          # prebuilt binary in the checkout still fails this check because the
          # binary must match the source it was built from.
          $expected = (Get-Content "engine/src/main.cpp" | Select-String 'kEngineVersion\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "Expected version (from main.cpp): $expected"
          if (-not $expected) { throw "Could not read kEngineVersion from engine/src/main.cpp" }
          if ($versionOut -notmatch [regex]::Escape("scorch-engine $expected")) { throw "Version check failed: $versionOut (expected scorch-engine $expected)" }
          if ($versionOut -notmatch "audio: built-in") { throw "Audio compile gate still present — engine reports no audio support" }

          # Stage 3c-hotfix: start the protocol-test step with a CLEAN
          # engine.log so the receipt assertions in Test E prove THIS run
          # wrote its receipts.
          Remove-Item (Join-Path $env:APPDATA "scorch\engine.log") -ErrorAction SilentlyContinue

          # Test A — --null-audio: JUCE null device, no hardware. The graph runs
          # in real time: transport play SUCCEEDS, state ticks ADVANCE, stop works.
          # Stage 3b polish RESUME contract: play(tick 480) starts at ~480 (NOT 0),
          # stop KEEPS the position, play WITHOUT tick RESUMES from it (NOT 0).
          Write-Host "=== Test A: --null-audio (play(480) -> ticks advance -> stop -> resume -> ticks advance) ==="
          $procA = Start-Process -FilePath "engine/build/scorch-engine.exe" -ArgumentList "--port","9378","--null-audio" -PassThru -NoNewWindow -RedirectStandardOutput "engine-a-stdout.txt" -RedirectStandardError "engine-a-stderr.txt"
          Start-Sleep -Seconds 3
          try {
            if ($procA.HasExited) {
              Write-Host "Engine A exited early (code=$($procA.ExitCode)). stdout:"
              if (Test-Path engine-a-stdout.txt) { Get-Content engine-a-stdout.txt }
              Write-Host "stderr:"
              if (Test-Path engine-a-stderr.txt) { Get-Content engine-a-stderr.txt }
              throw "Engine A process exited before test could connect"
            }
            node .github/scripts/test-engine-protocol.mjs 9378 null-audio
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Engine A stdout:"
              if (Test-Path engine-a-stdout.txt) { Get-Content engine-a-stdout.txt }
              Write-Host "Engine A stderr:"
              if (Test-Path engine-a-stderr.txt) { Get-Content engine-a-stderr.txt }
              throw "Engine A null-audio protocol test failed"
            }
            # Stage 3c close-out — MUSICAL RELEASE proof from the engine's own
            # stdout: the stop handler reports the musical release (voices
            # releasing + plugin note-offs), NOT an instant kill. Missing line
            # = the transport-transition semantics regressed.
            $killProof = Select-String -Path "engine-a-stdout.txt" -Pattern "musical release"
            if (-not $killProof) { throw "stop musical-release proof missing: 'musical release' not in engine stdout" }
            Write-Host "Musical-release proof: $($killProof.Line)"
            $reattackProof = Select-String -Path "engine-a-stdout.txt" -Pattern "re-attacks"
            if (-not $reattackProof) { throw "resume re-attack proof missing: no 're-attacks' in engine stdout (straddle handling regressed)" }
            Write-Host "Resume re-attack proof: $($reattackProof.Line)"
            $resumeProof = Select-String -Path "engine-a-stdout.txt" -Pattern "transport play from tick"
            if (-not $resumeProof) { throw "resume proof missing: no 'transport play from tick' lines in engine stdout" }
            foreach ($l in $resumeProof.Line) { Write-Host "Resume proof: $l" }
            # shutdown -> clean exit 0. A 0xC0000005 would surface as a
            # negative/negative-hex exit code and fail this check.
            $procA.WaitForExit(10000) | Out-Null
            if (-not $procA.HasExited -or $procA.ExitCode -ne 0) { throw "Engine A did not exit cleanly (code=$($procA.ExitCode))" }
            Write-Host "Engine A clean exit 0"
          } finally {
            Stop-Process -Id $procA.Id -Force -ErrorAction SilentlyContinue
          }

          # Test B — NO flag on a headless runner: lazy audio init finds no
          # device, transport play returns the graceful no_audio_device error
          # (the historical 0xC0000005 crash is now a clean protocol reply),
          # and the engine stays protocol-functional afterwards.
          Write-Host "=== Test B: no flag (play -> graceful no_audio_device error, no crash) ==="
          $procB = Start-Process -FilePath "engine/build/scorch-engine.exe" -ArgumentList "--port","9379" -PassThru -NoNewWindow -RedirectStandardOutput "engine-b-stdout.txt" -RedirectStandardError "engine-b-stderr.txt"
          Start-Sleep -Seconds 3
          try {
            if ($procB.HasExited) {
              Write-Host "Engine B exited early (code=$($procB.ExitCode)). stdout:"
              if (Test-Path engine-b-stdout.txt) { Get-Content engine-b-stdout.txt }
              Write-Host "stderr:"
              if (Test-Path engine-b-stderr.txt) { Get-Content engine-b-stderr.txt }
              throw "Engine B process exited before test could connect"
            }
            node .github/scripts/test-engine-protocol.mjs 9379 no-device
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Engine B stdout:"
              if (Test-Path engine-b-stdout.txt) { Get-Content engine-b-stdout.txt }
              Write-Host "Engine B stderr:"
              if (Test-Path engine-b-stderr.txt) { Get-Content engine-b-stderr.txt }
              throw "Engine B no-device graceful-error test failed"
            }
            $procB.WaitForExit(10000) | Out-Null
            if (-not $procB.HasExited -or $procB.ExitCode -ne 0) { throw "Engine B did not exit cleanly (code=$($procB.ExitCode))" }
            Write-Host "Engine B clean exit 0 (headless crash path is gone)"
          } finally {
            Stop-Process -Id $procB.Id -Force -ErrorAction SilentlyContinue
          }

          Write-Host "All engine protocol tests passed (audio-capable build, graceful headless behavior)"

          # Test C — Stage 3c-1 VST3 scan protocol: valid plugin found (real
          # name + vendor), CRASH-ISOLATION (worker dies → failed entry, scan
          # + engine survive), corrupt .vst3 graceful, default-dir scan clean.
          # Stage 3f-7: --null-audio so the transport-pause proof can actually
          # roll the transport (a device-less runner would refuse play); the
          # scan itself never touches audio.
          Write-Host "=== Test C: VST3 scan protocol + crash isolation ==="
          $procC = Start-Process -FilePath "engine/build/scorch-engine.exe" -ArgumentList "--port","9380","--null-audio" -PassThru -NoNewWindow -RedirectStandardOutput "engine-c-stdout.txt" -RedirectStandardError "engine-c-stderr.txt"
          Start-Sleep -Seconds 3
          try {
            if ($procC.HasExited) {
              Write-Host "Engine C exited early (code=$($procC.ExitCode)). stdout:"
              if (Test-Path engine-c-stdout.txt) { Get-Content engine-c-stdout.txt }
              throw "Engine C process exited before test could connect"
            }
            node .github/scripts/test-engine-protocol.mjs 9380 scan "$env:SCAN_FIXTURES"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Engine C stdout:"
              if (Test-Path engine-c-stdout.txt) { Get-Content engine-c-stdout.txt }
              Write-Host "Engine C stderr:"
              if (Test-Path engine-c-stderr.txt) { Get-Content engine-c-stderr.txt }
              throw "Engine C scan-protocol test failed"
            }
            # The scan summary must be in the engine's own stdout.
            $scanProof = Select-String -Path "engine-c-stdout.txt" -Pattern "\[engine\] scan: "
            if (-not $scanProof) { throw "scan proof missing: no '[engine] scan:' lines in engine stdout" }
            foreach ($l in $scanProof.Line) { Write-Host "Scan proof: $l" }
            # Stage 3f-2 receipt assertions (engine.log — cleaned at step start):
            # one [scan] line PER SCANNED plugin (path/outcome/elapsedMs), a
            # summary naming the probed-row count, and one [probe] line per
            # probe outcome class (ok + timeout + crashed must ALL exist —
            # the ProbeHangDummy eats its 90 s; ProbeCrashDummy dies).
            $scanLines = Select-String -Path (Join-Path $env:APPDATA "scorch\engine.log") -Pattern "\[scan\] path="
            if (-not $scanLines) { throw "3f-2 receipt missing: no '[scan] path=' lines in engine.log" }
            Write-Host "[scan] per-plugin receipt lines: $($scanLines.Count)"
            $scanSummary = Select-String -Path (Join-Path $env:APPDATA "scorch\engine.log") -Pattern "\[scan\] summary: .*probing"
            if (-not $scanSummary) { throw "3f-2 receipt missing: no '[scan] summary ... probing' line in engine.log" }
            foreach ($l in $scanSummary.Line) { Write-Host "Scan summary: $l" }
            foreach ($required in @("outcome=ok", "outcome=timeout", "outcome=crashed")) {
              $probeLine = Select-String -Path (Join-Path $env:APPDATA "scorch\engine.log") -Pattern ("\[probe\] .*" + [regex]::Escape($required))
              if (-not $probeLine) { throw "3f-2 receipt missing: no '[probe] ... $required' line in engine.log" }
              Write-Host "Probe proof: $($probeLine.Line.Substring(0, [Math]::Min(120, $probeLine.Line.Length)))"
            }
            $procC.WaitForExit(10000) | Out-Null
            if (-not $procC.HasExited -or $procC.ExitCode -ne 0) { throw "Engine C did not exit cleanly (code=$($procC.ExitCode))" }
            Write-Host "Engine C clean exit 0 (scan + crash isolation verified)"
          } finally {
            Stop-Process -Id $procC.Id -Force -ErrorAction SilentlyContinue
          }

          # Test D — Stage 3c-2 HOSTING: load the free test VST3 by uid+path,
          # prove over the wire: plugin_state loaded (latency<100ms), UACC
          # pre-trigger arithmetic (CC#32 exactly 38 ticks ≈ 20ms before its
          # note, sample-accurate), channel routing (ch1+ch2 dispatched AND
          # received by the plugin — the [testvst] stdout log), AUDIBLE
          # mute/solo gating (peaks: unmuted > 0, muted = 0, gated note never
          # dispatched, unmute restores). Stage 3c close-out: MUSICAL stops
          # (release marker + exact held-note offs, NO CC120), resume with
          # gentle re-attacks + UACC articulation suppression of redundant
          # CC#32 sends.
          Write-Host "=== Test D: VST3 hosting + channel routing + audible gating ==="
          $env:SCORCH_TESTVST_LOG = "1"
          # Stage 3f-7 (item 1): the fixture reports an INFINITE tail in this
          # engine — every capability JSON (probe receipt + plugin_capabilities)
          # must carry tailSeconds as null, never a bare inf. Inherited by the
          # probe-worker children (probe-on-load + the explicit probe).
          $env:SCORCH_TESTVST_INFTAIL = "1"
          $procD = Start-Process -FilePath "engine/build/scorch-engine.exe" -ArgumentList "--port","9381","--null-audio" -PassThru -NoNewWindow -RedirectStandardOutput "engine-d-stdout.txt" -RedirectStandardError "engine-d-stderr.txt"
          Start-Sleep -Seconds 3
          try {
            if ($procD.HasExited) {
              Write-Host "Engine D exited early (code=$($procD.ExitCode)). stdout:"
              if (Test-Path engine-d-stdout.txt) { Get-Content engine-d-stdout.txt }
              throw "Engine D process exited before test could connect"
            }
            node .github/scripts/test-engine-protocol.mjs 9381 host "$env:SCAN_FIXTURES"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Engine D stdout:"
              if (Test-Path engine-d-stdout.txt) { Get-Content engine-d-stdout.txt }
              Write-Host "Engine D stderr:"
              if (Test-Path engine-d-stderr.txt) { Get-Content engine-d-stderr.txt }
              throw "Engine D hosting test failed"
            }
            # END-TO-END routing proof from the PLUGIN's own stdout: the hosted
            # plugin received the dispatched notes on BOTH hosted channels.
            $ch2Note = Select-String -Path "engine-d-stdout.txt" -Pattern "\[testvst\].*ch=2 k=NOTE_ON"
            if (-not $ch2Note) { throw "channel routing proof missing: plugin never received a ch=2 NOTE_ON" }
            Write-Host "Plugin-side routing proof: $($ch2Note.Line[0])"
            $pluginLoaded = Select-String -Path "engine-d-stdout.txt" -Pattern "\[engine\] plugin loaded: name=Scorch Test Synth"
            if (-not $pluginLoaded) { throw "plugin-loaded proof missing from engine stdout" }
            foreach ($l in $pluginLoaded.Line) { Write-Host "Hosting proof: $l" }
            # Stage 3e-2: TRANSPORT PLAYHEAD proof — the hosted plugin SEES the
            # engine's AudioPlayHead: bpm must equal the project bpm (120, the
            # load's meta.bpm) and ppq must INCREASE while the transport rolls.
            $phLines = Select-String -Path "engine-d-stdout.txt" -Pattern "\[testvst\] playhead .*playing=1"
            if (($phLines | Measure-Object).Count -lt 2) { throw "playhead proof missing: need >=2 playhead lines while playing, got $(($phLines | Measure-Object).Count)" }
            $bpmVals = @($phLines | ForEach-Object { if ($_.Line -match "bpm=([0-9.]+)") { [double]$Matches[1] } })
            if (($bpmVals | Where-Object { [Math]::Abs($_ - 120.0) -gt 0.01 }).Count -gt 0) { throw "playhead bpm mismatch: got $($bpmVals -join ',') != project bpm 120" }
            $ppqVals = @($phLines | ForEach-Object { if ($_.Line -match "ppq=([0-9.-]+)") { [double]$Matches[1] } })
            # M1: the playhead file now accumulates MANY plays (the x10
            # cycles' final proof + the state/MO plays), and a SHORT play's
            # only line is its first-block ppq=0 — so the LAST line is not
            # guaranteed to be a rolled one. The transport-roll proof is that
            # ppq ADVANCES across the session: max > min (order-independent).
            $ppqMax = ($ppqVals | Measure-Object -Maximum).Maximum
            $ppqMin = ($ppqVals | Measure-Object -Minimum).Minimum
            if ($ppqVals.Count -lt 2 -or $ppqMax -le $ppqMin) { throw "playhead ppq not increasing while playing: $($ppqVals -join ',')" }
            Write-Host "Playhead proof: bpm $($bpmVals[0]) == project bpm 120; ppq advanced $($ppqMin) -> $($ppqMax) while playing"
            $procD.WaitForExit(10000) | Out-Null
            if (-not $procD.HasExited -or $procD.ExitCode -ne 0) { throw "Engine D did not exit cleanly (code=$($procD.ExitCode))" }
            Write-Host "Engine D clean exit 0 (hosting + routing + gating verified)"
          } finally {
            Stop-Process -Id $procD.Id -Force -ErrorAction SilentlyContinue
            Remove-Item Env:\SCORCH_TESTVST_LOG -ErrorAction SilentlyContinue
            Remove-Item Env:\SCORCH_TESTVST_INFTAIL -ErrorAction SilentlyContinue
          }

          # Test D2 — Stage 3d-4 MULTI-INSTANCE hosting: the SAME free test
          # VST3 hosted TWICE (inst-a + inst-b) via plugins[]+routing — the
          # universal-hosting completion proof. Over the wire: 2× plugin_state
          # loaded (per-instance ids), BOTH instances audible (summed peak >
          # single-source cap), per-instance dispatch (wide channels 1 AND 17
          # in the ledger), mid-play SAME-set reuse, mid-play CHANGED-set
          # rejection, TWO SIMULTANEOUS editor windows (open inst-b → raise →
          # open inst-a → per-id closes), state captured PER INSTANCE.
          # No plugin-name logic anywhere: the second instance is the SAME
          # binary under a DIFFERENT libraryGroup id — universality is the point.
          Write-Host "=== Test D2: multi-instance hosting (editors, per-instance state) ==="
          $env:SCORCH_TESTVST_LOG = "1"
          # Stage 3f-6: the engine process's env names the slow-state marker
          # file; the test script (same shell session, same env) creates and
          # removes it mid-session to stall every PREPARED test-synth
          # instance's getStateInformation while it exists (a being-created
          # instance is not prepared yet, so JUCE's creation state handshake
          # stays fast). Only D2 opts in — A/D/E engines run without it.
          $env:SCORCH_TESTVST_SLOWSTATE_FILE = (Join-Path (Get-Location) "scorch-3f6-slowstate.marker")
          Remove-Item $env:SCORCH_TESTVST_SLOWSTATE_FILE -ErrorAction SilentlyContinue
          # Stage 3h: the audio-stall marker — while it exists, the first
          # audio buffer to observe the appear transition freezes the audio
          # thread 2.5 s INSIDE the callback (the regression probe's
          # controllable "stalled audio thread"). Only D2 opts in.
          $env:SCORCH_TEST_AUDIO_STALL_FILE = (Join-Path (Get-Location) "scorch-3h-audio-stall.marker")
          Remove-Item $env:SCORCH_TEST_AUDIO_STALL_FILE -ErrorAction SilentlyContinue
          $procD2 = Start-Process -FilePath "engine/build/scorch-engine.exe" -ArgumentList "--port","9383","--null-audio" -PassThru -NoNewWindow -RedirectStandardOutput "engine-d2-stdout.txt" -RedirectStandardError "engine-d2-stderr.txt"
          Start-Sleep -Seconds 3
          try {
            if ($procD2.HasExited) {
              Write-Host "Engine D2 exited early (code=$($procD2.ExitCode)). stdout:"
              if (Test-Path engine-d2-stdout.txt) { Get-Content engine-d2-stdout.txt }
              throw "Engine D2 process exited before test could connect"
            }
            node .github/scripts/test-engine-protocol.mjs 9383 multi "$env:SCAN_FIXTURES"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Engine D2 stdout:"
              if (Test-Path engine-d2-stdout.txt) { Get-Content engine-d2-stdout.txt }
              Write-Host "Engine D2 stderr:"
              if (Test-Path engine-d2-stderr.txt) { Get-Content engine-d2-stderr.txt }
              throw "Engine D2 multi-instance test failed"
            }
            # Plugin-side proof (M1 deferral contract): multi-instance loads
            # are REFUSED (the named receipt is asserted in the summary block
            # below), and the ONE hosted instance still renders real notes
            # through the graph — >=1 ch=1 NOTE_ON proves the plugin path.
            # The two-instance note proof returns with the multi-instance
            # milestone.
            $instNotes = Select-String -Path "engine-d2-stdout.txt" -Pattern "\[testvst\].*ch=1 k=NOTE_ON"
            $instCount = ($instNotes | Measure-Object).Count
            if ($instCount -lt 1) { throw "plugin-side proof missing: the single hosted instance received no ch=1 NOTE_ON (multi-instance hosting is deferred — one instance must still render), got $instCount" }
            Write-Host "Plugin-side proof (M1 deferral): $instCount ch=1 NOTE_ON(s) through the single hosted instance"
            # Stage 3f-6: plugin-side proof that the slow-capture path was
            # ACTUALLY taken — inst-a's capture job runs while the marker is
            # armed and STALLS inside getStateInformation. (The LATER capture
            # jobs queue behind that 10 s sleep and start after the test has
            # disarmed the marker — the marker is checked at ENTRY — so their
            # TIMEOUT receipts come from the init thread's 3000 ms budget
            # expiring against a BUSY message thread, which is the exact
            # defect shape: a slow capture starving the publish section.)
            # M1 deferral contract: the marker-stall race only deterministically
            # fires with TWO retiring instances (the pre-migration D2 set).
            # The deferral flow retires ONE instance per unload with a narrow
            # armed window, so the hook is timing-luck here — the marker-stall
            # proof returns with the multi-instance milestone. The machinery
            # the hook protects (retire capture BEGIN/END + the init thread's
            # budget) stays proven by Test D's x10 unload retire captures,
            # asserted in the summary block below.
            $slowCaps = (Select-String -Path "engine-d2-stdout.txt" -Pattern "\[testvst\] slow state capture: marker present").Count
            if ($slowCaps -ge 1) {
              Write-Host "3f-6 slow-capture proof: $slowCaps stall(s) inside getStateInformation"
            } else {
              Write-Host "3f-6 slow-capture hook not exercised this run (M1 deferral: the single-instance retire window is narrow; the marker-stall proof returns with multi-instance) — the capture-path machinery is proven by Test D's x10 retire captures"
            }
            $procD2.WaitForExit(20000) | Out-Null
            if (-not $procD2.HasExited -or $procD2.ExitCode -ne 0) { throw "Engine D2 did not exit cleanly (code=$($procD2.ExitCode))" }
            Write-Host "Engine D2 clean exit 0 (multi-instance + publish-safe verified)"
          } finally {
            Stop-Process -Id $procD2.Id -Force -ErrorAction SilentlyContinue
            # Stage 3f-6 cleanup: the marker must never leak into later tests
            # (an armed marker would stall any capture that outlives D2).
            Remove-Item $env:SCORCH_TESTVST_SLOWSTATE_FILE -ErrorAction SilentlyContinue
            Remove-Item Env:\SCORCH_TESTVST_SLOWSTATE_FILE -ErrorAction SilentlyContinue
            # Stage 3h cleanup: same policy for the audio-stall marker (an
            # armed marker would freeze the audio thread of any engine that
            # outlives D2 — there are none today, but the env must not leak).
            Remove-Item $env:SCORCH_TEST_AUDIO_STALL_FILE -ErrorAction SilentlyContinue
            Remove-Item Env:\SCORCH_TEST_AUDIO_STALL_FILE -ErrorAction SilentlyContinue
            Remove-Item Env:\SCORCH_TESTVST_LOG -ErrorAction SilentlyContinue
          }

          # Test D3 — Stage 3i: RUNTIME LATENCY TRACKING (detect, then
          # mini-republish). The fixture's reserved CC#23 commands runtime
          # latency changes (notified 1024/0, SILENT 2048, a 40-toggle notified
          # flicker settling at 1024) while the transport ROLLS. The harness
          # asserts over the wire (reuse receipt latencyMs chain, transport
          # continuity, exactly one load-path publish); the engine.log
          # assertions below prove the receipt discipline itself.
          Write-Host "=== Test D3: runtime latency tracking (detect -> mini-republish, no reload) ==="
          $env:SCORCH_TESTVST_LOG = "1"
          $procD3 = Start-Process -FilePath "engine/build/scorch-engine.exe" -ArgumentList "--port","9384","--null-audio" -PassThru -NoNewWindow -RedirectStandardOutput "engine-d3-stdout.txt" -RedirectStandardError "engine-d3-stderr.txt"
          Start-Sleep -Seconds 3
          try {
            if ($procD3.HasExited) {
              Write-Host "Engine D3 exited early (code=$($procD3.ExitCode)). stdout:"
              if (Test-Path engine-d3-stdout.txt) { Get-Content engine-d3-stdout.txt }
              throw "Engine D3 process exited before test could connect"
            }
            node .github/scripts/test-engine-protocol.mjs 9384 latency "$env:SCAN_FIXTURES"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Engine D3 stdout:"
              if (Test-Path engine-d3-stdout.txt) { Get-Content engine-d3-stdout.txt }
              Write-Host "Engine D3 stderr:"
              if (Test-Path engine-d3-stderr.txt) { Get-Content engine-d3-stderr.txt }
              throw "Engine D3 runtime-latency test failed"
            }
            # Fixture-side proof: every CC#23 command was taken by the synth
            # (the [testvst] latency lines name value + notified flag + mode).
            $fx = Get-Content "engine-d3-stdout.txt" | Select-String -Pattern "\[testvst\] latency n=(\d+) notified=(\d) mode=(\w+)"
            if (($fx | Measure-Object).Count -lt 8) { throw "3i fixture-side proof missing: expected >= 8 [testvst] latency lines, got $(($fx | Measure-Object).Count)" }
            $modes = $fx.Matches | ForEach-Object { $_.Groups[3].Value }
            if (-not ($modes -contains "cc") -or -not ($modes -contains "silent") -or -not ($modes -contains "settle")) { throw "3i fixture-side proof incomplete: cc/silent/settle modes must all appear ($($modes -join ','))" }
            Write-Host "3i fixture-side proof: $(($fx | Measure-Object).Count) latency command(s) taken (cc/silent/flicker/settle)"
            # Engine.log receipts: the republish discipline itself. inst-lat is
            # unique to D3, so these counts are isolated from the other tests.
            $engineLog = Join-Path $env:APPDATA "scorch\engine.log"
            $latRepub = (Select-String -Path $engineLog -Pattern "\[latency\] republish instance=inst-lat old=(\d+) new=(\d+) samples").Count
            if ($latRepub -lt 5) { throw "3i receipt missing: expected >= 5 '[latency] republish' receipts for inst-lat (up/down/silent/flicker/final), got $latRepub" }
            if ($latRepub -gt 15) { throw "3i rate-limit broken: $latRepub republish receipts for inst-lat exceeds the 15 bound (one per instance per second)" }
            $latDeferred = (Select-String -Path $engineLog -Pattern "\[latency\] republish deferred — rate limit .* instance=inst-lat").Count
            if ($latDeferred -lt 1) { throw "3i receipt missing: the flicker must have hit the one-per-second rate limit at least once (deferred receipt)" }
            # The commanded correction pairs must ALL appear (order-insensitive;
            # mid-flicker pairs vary by drain timing):
            foreach ($pair in @("old=128 new=1024", "old=1024 new=0", "old=0 new=1024", "old=1024 new=2048")) {
              $hit = Select-String -Path $engineLog -Pattern ("\[latency\] republish instance=inst-lat " + [regex]::Escape($pair))
              if (-not $hit) { throw "3i receipt missing: no '[latency] republish ... $pair' for inst-lat in engine.log" }
            }
            $finalPair = Select-String -Path $engineLog -Pattern "\[latency\] republish instance=inst-lat old=\d+ new=1024 samples"
            if (-not $finalPair) { throw "3i final-state receipt missing: no republish landing inst-lat at 1024 after the flicker settle" }
            $pubSummaries = (Select-String -Path $engineLog -Pattern "\[latency\] publish: node latency corrected=").Count
            if ($pubSummaries -lt 4) { throw "3i receipt missing: expected >= 4 '[latency] publish: node latency corrected' summaries, got $pubSummaries" }
            # NO-RELOAD proof: exactly ONE load-path publish for inst-lat (the
            # initial load) — every correction rode the mini-republish, and the
            # five mid-play event swaps took the reuse fast path.
            $loadedLat = (Select-String -Path $engineLog -Pattern "\[plugin\] loaded name=.* instance=inst-lat").Count
            if ($loadedLat -ne 1) { throw "3i no-reload proof failed: inst-lat must publish through the load path EXACTLY once, got $loadedLat" }
            $reuseLat = (Select-String -Path $engineLog -Pattern "\[plugin\] reuse while playing.*instance=inst-lat").Count
            if ($reuseLat -ne 5) { throw "3i reuse proof failed: expected exactly 5 mid-play reuse receipts for inst-lat, got $reuseLat" }
            # ── Stage 3j gate additions (docs/LATENCY_GATE.md) ──
            # (a) The safety-net walk SPEAKS: the rapid pair's second enqueue
            # is rate-limited, stays pending, and the walk lands it — the
            # "debounce confirmed" receipt is the greppable middle of the
            # convolver by-ear gate. (The "[latency] saw" arming line is
            # structurally unreachable in steady state — JUCE's
            # setLatencySamples auto-notifies, so every walk entry arrives
            # with a pre-existing pending record; the saw fires only in the
            # pre-attach window / wrapper-bypass paths — documented in
            # docs/LATENCY_GATE.md, deliberately not CI-asserted.)
            $latConfirmed = (Select-String -Path $engineLog -Pattern "\[latency\] debounce confirmed instance=inst-lat ").Count
            if ($latConfirmed -lt 1) { throw "3j receipt missing: no '[latency] debounce confirmed' for inst-lat — the safety-net walk must name the landing of the rate-limited pair candidate" }
            # (b) The RESURRECTION proof, in the engine log: the FINAL reuse
            # receipt is the no-CC probe load — it must carry the
            # watchdog-corrected latencySamples=1024, never a stale value.
            $reuseLines = @(Select-String -Path $engineLog -Pattern "\[plugin\] reuse while playing.*instance=inst-lat")
            $lastReuseLat = if ($reuseLines.Count -gt 0 -and $reuseLines[-1].Line -match "latencySamples=(\d+)") { [int]$Matches[1] } else { -1 }
            if ($lastReuseLat -ne 1024) { throw "3j resurrection proof failed: the final no-CC reuse receipt carries latencySamples=$lastReuseLat, expected 1024 — a reload resurrected the pre-correction value (one-write-discipline broken)" }
            Write-Host "3j gate receipts: $latConfirmed debounce confirmed, final reuse latencySamples=$lastReuseLat (corrected value survived the reload)"

            # ── Phase 2 (downbeat-late pre-roll) ──
            # The transport's play receipt: the engine must have armed a
            # muted pre-roll of EXACTLY the play-time max plugin latency
            # (128 = the fixture's default before any CC#23 command). The
            # window pre-fires the tick-0 events so the downbeat lands on
            # the grid; the wire-side proof (the tick-0 NOTE_ON dispatched
            # at ledger s=-128, never s=0) is asserted by the harness close.
            $preRoll = (Select-String -Path $engineLog -Pattern "\[transport\] pre-roll 128 samples \(max plugin latency\)").Count
            if ($preRoll -lt 1) { throw "phase-2 receipt missing: no '[transport] pre-roll 128 samples' in engine.log — the downbeat-late pre-roll did not arm at play" }
            Write-Host "phase-2 receipts: $preRoll pre-roll window(s) armed at play (128 samples = the play-time max plugin latency)"

            # NO-DISRUPTION proof: no editor traffic for this engine session —
            # the correction path must never touch editors (the D3 engine opens
            # none; any [editor] receipt would name an unexpected path).
            Write-Host "3i engine.log receipts: $latRepub republish(es) (all pairs present), $latDeferred deferred, $loadedLat load-path publish, $reuseLat reuse, $pubSummaries publish summaries"
            $procD3.WaitForExit(20000) | Out-Null
            if (-not $procD3.HasExited -or $procD3.ExitCode -ne 0) { throw "Engine D3 did not exit cleanly (code=$($procD3.ExitCode))" }
            Write-Host "Engine D3 clean exit 0 (runtime-latency tracking verified)"
          } finally {
            Stop-Process -Id $procD3.Id -Force -ErrorAction SilentlyContinue
            Remove-Item Env:\SCORCH_TESTVST_LOG -ErrorAction SilentlyContinue
          }

          # Test D4 — M1-hotfix (heavy-load death): the 2026-10-18 class with a
          # stand-in fixture. The engine runs with SCORCH_TESTVST_SLOW_CREATE_S=6
          # (the fixture CONSTRUCTOR sleeps 6 s — the cold-instantiate shape) and
          # SCORCH_TESTVST_SLOW_PREPARE_N=1 / _S=6 (the FIRST prepareToPlay call
          # sleeps 6 s — with the hotfix that call is the worker's create-time
          # prepare (the wrapper early-outs identical-settings re-prepares, so
          # the fixture sees exactly one prepare per load); a regression that
          # moves the first prepare ONTO the message thread makes the MM stall
          # 6 s AFTER the prepared-(worker) receipt and the [mm] assertion
          # below FAILS). The harness
          # asserts over the wire: loadAck < 3 s (the async ack contract — the
          # old fixed 4000 ms loadAck timer expired during the real Falcon
          # death/restart window and the user read "reload failed"), plugin_state
          # loaded >= 11 s (the sleeps really ran on the worker), play/ticks/
          # peak/stop prove the engine fully alive behind a 12 s load.
          Write-Host "=== Test D4: slow load (6s create + 6s worker prepare) — async ack contract + no MM wedge ==="
          $env:SCORCH_TESTVST_LOG = "1"
          $env:SCORCH_TESTVST_SLOW_CREATE_S = "6"
          $env:SCORCH_TESTVST_SLOW_PREPARE_N = "1"
          $env:SCORCH_TESTVST_SLOW_PREPARE_S = "6"
          # Line offset into engine.log where D4 begins (the log is shared by
          # every test in this step; the [mm] assertion must be isolated to
          # THIS engine's session).
          $engineLogD4 = Join-Path $env:APPDATA "scorch\engine.log"
          $logLinesBeforeD4 = (Get-Content $engineLogD4).Count
          $procD4 = Start-Process -FilePath "engine/build/scorch-engine.exe" -ArgumentList "--port","9385","--null-audio" -PassThru -NoNewWindow -RedirectStandardOutput "engine-d4-stdout.txt" -RedirectStandardError "engine-d4-stderr.txt"
          Start-Sleep -Seconds 3
          try {
            if ($procD4.HasExited) {
              Write-Host "Engine D4 exited early (code=$($procD4.ExitCode)). stdout:"
              if (Test-Path engine-d4-stdout.txt) { Get-Content engine-d4-stdout.txt }
              Write-Host "Engine D4 stderr:"
              if (Test-Path engine-d4-stderr.txt) { Get-Content engine-d4-stderr.txt }
              throw "Engine D4 process exited before test could connect"
            }
            node .github/scripts/test-engine-protocol.mjs 9385 slowload "$env:SCAN_FIXTURES"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Engine D4 stdout:"
              if (Test-Path engine-d4-stdout.txt) { Get-Content engine-d4-stdout.txt }
              Write-Host "Engine D4 stderr:"
              if (Test-Path engine-d4-stderr.txt) { Get-Content engine-d4-stderr.txt }
              throw "Engine D4 slowload test failed"
            }
            # Fixture-side proof: both sleeps were taken by the synth.
            $fxCreate = Get-Content "engine-d4-stdout.txt" | Select-String -Pattern "\[testvst\] slow-create sleeping 6 s"
            if (-not $fxCreate) { throw "M1-hotfix fixture-side proof missing: no '[testvst] slow-create sleeping 6 s' in the D4 stdout" }
            $fxPrepare = Get-Content "engine-d4-stdout.txt" | Select-String -Pattern "\[testvst\] slow-prepare call=1 sleeping 6 s"
            if (-not $fxPrepare) { throw "M1-hotfix fixture-side proof missing: no '[testvst] slow-prepare call=1 sleeping 6 s' — the worker-side create-time prepare did not run (call 1 is the worker's own prepare, BEFORE the commit job; the wrapper early-outs identical-settings re-prepares, so the fixture sees exactly ONE prepare per load)" }
            Write-Host "M1-hotfix fixture-side proof: slow-create 6s + slow-prepare call=2 6s both taken"
            # Engine.log receipts, isolated to the D4 session. The JUCE 8.0.4
            # fact measured while building this test: the VST3 wrapper
            # serializes a plugin's cold constructor AND its first
            # prepareToPlay against the message thread (MessageManagerLock
            # inside the wrapper — the plugin's work freezes the MM no matter
            # which thread calls it). Those windows are STRUCTURAL (the stock
            # AudioPluginHost has them too; the legacy 3c-era engine measured
            # the same 5.7 s BBCSO freeze). The hotfix contract is therefore:
            # (a) every window RECOVERS (the real Falcon loads DIED instead),
            # (b) the window count is bounded (<= 2: create + worker prepare),
            # (c) the GLUE-OWNED phases add no window: zero unresponsive
            #     receipts after "[plugin] prepared (worker)" (the commit's
            #     re-prepare early-outs at identical settings, the retire
            #     capture is worker-side, publish is receipt-only).
            $d4Lines = Get-Content $engineLogD4 | Select-Object -Skip $logLinesBeforeD4
            $mmUnresp = @($d4Lines | Select-String -Pattern "\[mm\] message thread unresponsive")
            $mmRecov  = @($d4Lines | Select-String -Pattern "\[mm\] message thread recovered")
            if (($mmUnresp | Measure-Object).Count -gt 2) {
              Write-Host $mmUnresp
              throw "M1-hotfix: $(($mmUnresp | Measure-Object).Count) '[mm] unresponsive' windows exceed the structural bound of 2 (create + worker prepare) — an extra heavy phase ran on the message thread"
            }
            # At least one window must provably RECOVER (the real Falcon shape:
            # wedge then DEATH — no recovery, no clean exit). A second window
            # may legitimately lack its recovered line when the session ends
            # within the heartbeat's 1 s cadence (shutdown race — observed
            # locally); the clean-exit-0 proof below covers that case.
            if (($mmRecov | Measure-Object).Count -lt 1) {
              throw "M1-hotfix: no '[mm] recovered' receipt — a message-thread stall never recovered (the real Falcon shape: wedge then death)"
            }
            # (b) The worker-side prepare receipt (the legacy init-thread pattern
            #     restored) — the load path must show it BEFORE the commit.
            $preparedWorker = @($d4Lines | Select-String -Pattern "\[plugin\] prepared \(worker\)")
            if (($preparedWorker | Measure-Object).Count -lt 1) { throw "M1-hotfix receipt missing: no '[plugin] prepared (worker)' in the D4 session — the legacy init-thread prepare did not run" }
            # (c) Zero NEW unresponsive windows after the worker prepare: the
            #     commit re-prepare early-outs, the retire capture is
            #     worker-side, publish is receipt-only.
            $pwLine = $preparedWorker[-1].LineNumber
            $mmAfter = @($d4Lines | Select-String -Pattern "\[mm\] message thread unresponsive" | Where-Object { $_.LineNumber -gt $pwLine })
            if (($mmAfter | Measure-Object).Count -ne 0) {
              Write-Host $mmAfter
              throw "M1-hotfix: a NEW '[mm] unresponsive' window opened AFTER the worker-side prepare — a glue-owned phase (commit/retire/publish) blocked the message thread"
            }
            # (d) The MM-commit guard stays silent (no commit FAILED receipt).
            $commitFail = @($d4Lines | Select-String -Pattern "\[plugin\] commit FAILED")
            if (($commitFail | Measure-Object).Count -ne 0) { throw "M1-hotfix: '[plugin] commit FAILED' receipt in the D4 session" }
            Write-Host "M1-hotfix engine.log receipts: $(($mmUnresp | Measure-Object).Count) structural [mm] window(s), all recovered; 0 new windows after the worker prepare; 0 commit FAILED"
            $procD4.WaitForExit(20000) | Out-Null
            if (-not $procD4.HasExited -or $procD4.ExitCode -ne 0) { throw "Engine D4 did not exit cleanly (code=$($procD4.ExitCode))" }
            Write-Host "Engine D4 clean exit 0 (heavy-load class verified: async ack, no MM wedge, engine alive)"
          } finally {
            Stop-Process -Id $procD4.Id -Force -ErrorAction SilentlyContinue
            Remove-Item Env:\SCORCH_TESTVST_LOG -ErrorAction SilentlyContinue
            Remove-Item Env:\SCORCH_TESTVST_SLOW_CREATE_S -ErrorAction SilentlyContinue
            Remove-Item Env:\SCORCH_TESTVST_SLOW_PREPARE_N -ErrorAction SilentlyContinue
            Remove-Item Env:\SCORCH_TESTVST_SLOW_PREPARE_S -ErrorAction SilentlyContinue
          }

          # Test E — Stage 3c-hotfix: REAL-PROJECT-SIZED load. The CI gap was
          # scale; this closes it: a deterministic 13,824-event (~1.1 MB)
          # fixture is sent as ONE load message and the loadAck receipt must
          # round-trip exactly (received == loaded == sent, byteSize == bytes
          # sent), non-array events must be REJECTED (bad_load — the silent
          # empty-score path that shipped the regression), and a malformed
          # event must be NAMED. Then the engine.log receipts themselves are
          # asserted — the same log the user can pull from their machine.
          Write-Host "=== Test E: scale (13,824-event load -> loadAck receipt round-trip -> negative paths) ==="
          $procE = Start-Process -FilePath "engine/build/scorch-engine.exe" -ArgumentList "--port","9382","--null-audio" -PassThru -NoNewWindow -RedirectStandardOutput "engine-e-stdout.txt" -RedirectStandardError "engine-e-stderr.txt"
          Start-Sleep -Seconds 3
          try {
            if ($procE.HasExited) {
              Write-Host "Engine E exited early (code=$($procE.ExitCode)). stdout:"
              if (Test-Path engine-e-stdout.txt) { Get-Content engine-e-stdout.txt }
              Write-Host "stderr:"
              if (Test-Path engine-e-stderr.txt) { Get-Content engine-e-stderr.txt }
              throw "Engine E process exited before test could connect"
            }
            node .github/scripts/test-engine-protocol.mjs 9382 scale
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Engine E stdout:"
              if (Test-Path engine-e-stdout.txt) { Get-Content engine-e-stdout.txt }
              Write-Host "Engine E stderr:"
              if (Test-Path engine-e-stderr.txt) { Get-Content engine-e-stderr.txt }
              throw "Engine E scale protocol test failed"
            }
            $procE.WaitForExit(10000) | Out-Null
            if (-not $procE.HasExited -or $procE.ExitCode -ne 0) { throw "Engine E did not exit cleanly (code=$($procE.ExitCode))" }
            Write-Host "Engine E clean exit 0 (scale round-trip verified)"
          } finally {
            Stop-Process -Id $procE.Id -Force -ErrorAction SilentlyContinue
          }

          # Stage 3c-hotfix: assert the engine.log RECEIPTS exist — the black
          # box now writes down what it received and what it renders.
          Write-Host "=== engine.log receipts (the engine's view of the world) ==="
          $engineLog = Join-Path $env:APPDATA "scorch\engine.log"
          if (-not (Test-Path $engineLog)) { throw "engine.log missing at $engineLog — engine wrote no receipts" }
          Get-Content $engineLog | ForEach-Object { Write-Host $_ }
          $scaleReceipts = (Select-String -Path $engineLog -Pattern "\[load\] received \d+ bytes \| loaded 13,824 events").Count
          if ($scaleReceipts -lt 1) { throw "engine.log missing the scale load receipt (loaded 13,824 events)" }
          $playReceipts = (Select-String -Path $engineLog -Pattern "\[play\] rendering from tick \d+, [\d,]+ voices scheduled").Count
          if ($playReceipts -lt 1) { throw "engine.log missing the play receipt (rendering from tick X, N voices scheduled)" }
          $failReceipts = (Select-String -Path $engineLog -Pattern "\[load-fail\]").Count
          if ($failReceipts -lt 1) { throw "engine.log missing the negative-path receipt (load-fail)" }
          # Stage 3c-regression: async init + rolling-transport guard receipts
          # (Test D phase 1 stopped load + phase 6 stopped re-host = 2 each;
          # phase 8 same-plugin mid-play reuse; phase 9 plugin-change reject).
          $initReceipts = (Select-String -Path $engineLog -Pattern "\[plugin\] init started \(async\)").Count
          if ($initReceipts -lt 2) { throw "engine.log missing async plugin-init receipts (got $initReceipts, need 2)" }
          $loadedReceipts = (Select-String -Path $engineLog -Pattern "\[plugin\] loaded name=").Count
          if ($loadedReceipts -lt 2) { throw "engine.log missing plugin-loaded receipts (got $loadedReceipts, need 2)" }
          # Milestone 1: the publish section speaks through the VENDOR node
          # lifecycle. The x10 unload/reload cycle (test D) + test D's own
          # loads + the multi test's single load must each land a node live
          # receipt; the cycle's 10 unloads + test D's replace must land node
          # removed receipts. The old "publish: swapping set" / retire-budget
          # receipts are gone with the InstanceSet machinery (the vendor's
          # RenderSequenceExchange owns teardown now).
          $publishReceipts = (Select-String -Path $engineLog -Pattern "\[plugin\] publish: done").Count
          if ($publishReceipts -lt 3) { throw "engine.log missing milestone-1 publish receipts (got $publishReceipts, need >= 3)" }
          $nodeLive = (Select-String -Path $engineLog -Pattern "\[plugin\] node live instance=").Count
          if ($nodeLive -lt 11) { throw "engine.log missing vendor node-live receipts (got $nodeLive, need >= 11: test D loads + the x10 cycle reloads + the multi single load)" }
          $nodeRemoved = (Select-String -Path $engineLog -Pattern "\[plugin\] node removed instance=").Count
          if ($nodeRemoved -lt 10) { throw "engine.log missing vendor node-removed receipts (got $nodeRemoved, need >= 10: the x10 cycle unloads)" }
          # The x10 cycle's retire path: worker-side state capture (the
          # M1-hotfix moved the capture OFF the message thread — triggers
          # "unload (worker)" for the cycle's explicit unloads, "replace
          # (worker)" for replace loads) → editor close → removeNode on the
          # message thread. The capture receipts are the 3f-7 4b pair
          # "[plugin] capture BEGIN/END instance=... (trigger)" — the OLD
          # "retire capture" strings died with the set-retire machinery, and
          # the pre-hotfix inline "(replace)" trigger moved to the worker.
          $retireBegins = (Select-String -Path $engineLog -Pattern "\[plugin\] capture BEGIN instance=.*\((replace \(worker\)|unload \(worker\))\)").Count
          if ($retireBegins -lt 10) { throw "engine.log missing retire-capture BEGIN receipts (got $retireBegins, need >= 10: the cycle unloads must capture the outgoing state on the worker)" }
          $retireEnds = (Select-String -Path $engineLog -Pattern "\[plugin\] capture END instance=.*\((replace \(worker\)|unload \(worker\))\)").Count
          if ($retireEnds -lt 10) { throw "engine.log missing retire-capture END receipts (got $retireEnds, need >= 10)" }
          # Milestone 1: the multi test's refused multi-entry load must name
          # the deferral in the log (the wire-side plugin_state error is
          # asserted by the harness).
          $refusal = (Select-String -Path $engineLog -Pattern "\[load\] plugin set REFUSED: multi-instance hosting is deferred").Count
          if ($refusal -lt 1) { throw "engine.log missing the milestone-1 deferral refusal receipt" }
          $unloadReceipts = (Select-String -Path $engineLog -Pattern "\[plugin\] unload requested").Count
          if ($unloadReceipts -lt 10) { throw "engine.log missing the explicit-unload receipts (got $unloadReceipts, need >= 10: the x10 cycle)" }
          # Stage 3f-7 item 2 receipts: the probe pause gate. The scan test
          # rolls the transport mid-probeAll ("transport playing"), test D
          # probes during an open editor ("editor window open"), and D2's
          # probe-on-load pauses behind its own in-progress load ("load in
          # progress" — deterministic: the job is queued while the load flag
          # is held through the publish). Resume is logged 2 s after each.
          $probePaused = (Select-String -Path $engineLog -Pattern "\[probe\] paused \(reason=").Count
          if ($probePaused -lt 3) { throw "engine.log missing 3f-7 probe-pause receipts (got $probePaused, need >= 3: transport + editor + load in progress)" }
          $probeResumed = (Select-String -Path $engineLog -Pattern "\[probe\] resumed").Count
          if ($probeResumed -lt 2) { throw "engine.log missing 3f-7 probe-resume receipts (got $probeResumed, need >= 2)" }
          $probeLoadPause = (Select-String -Path $engineLog -Pattern "\[probe\] paused \(reason=load in progress\)").Count
          if ($probeLoadPause -lt 1) { throw "engine.log missing the load-in-progress probe pause (got $probeLoadPause, need >= 1)" }
          # Stage 3f-7 item 1: the infinite-tail probe (test D's engine env)
          # must produce a SUCCESSFUL probe receipt — outcome=ok in the log.
          $probeOk = (Select-String -Path $engineLog -Pattern "\[probe\] path=.*outcome=ok").Count
          if ($probeOk -lt 1) { throw "engine.log missing a successful probe receipt (got $probeOk, need >= 1 — the inf-tail fixture must probe outcome=ok)" }
          # Stage 3f-7 item 4a: the [mm] heartbeat receipt — its CI proof rode
          # D2's 10 s slow-capture budget machinery, which milestone 1 removed
          # (captures run inline in the vendor retire job). The heartbeat stays
          # in the engine; the CI proof returns with the capture rework.
          # Stage 3f-7 item 4b/4c: editor close + state capture BEGIN/END and
          # the closing-requested receipt (the closeEditor message path).
          # M1 deferral contract: Test D contributes exactly TWO editor
          # closes (phase F + the cycle finale); the pre-migration third+
          # closes came from D2's two multi-instance editor windows, which
          # return with the multi-instance milestone.
          $closingRequested = (Select-String -Path $engineLog -Pattern "\[editor\] closing requested instance=").Count
          if ($closingRequested -lt 2) { throw "engine.log missing closing-requested receipts (got $closingRequested, need >= 2: test D's phase F close + the cycle finale close)" }
          $closeBegin = (Select-String -Path $engineLog -Pattern "\[editor\] close BEGIN instance=").Count
          if ($closeBegin -lt 1) { throw "engine.log missing editor close BEGIN receipts (got $closeBegin, need >= 1)" }
          $captureBegin = (Select-String -Path $engineLog -Pattern "\[plugin\] capture BEGIN instance=").Count
          if ($captureBegin -lt 3) { throw "engine.log missing capture BEGIN receipts (got $captureBegin, need >= 3)" }
          # Stage 3f-7 item 4d: ONE arrival line per incoming message — the
          # log is full of them (every ping, every state-driven send).
          $wsArrivals = (Select-String -Path $engineLog -Pattern "\[ws\] message type=").Count
          if ($wsArrivals -lt 20) { throw "engine.log missing [ws] arrival receipts (got $wsArrivals, need >= 20)" }
          # Stage 3f-7 item 3: the scan test explicitly probes BEFORE probeAll
          # (lazy) — the requested-row receipt must exist.
          $probeRequested = (Select-String -Path $engineLog -Pattern "\[probe\] requested classId=").Count
          if ($probeRequested -lt 2) { throw "engine.log missing on-demand probe receipts (got $probeRequested, need >= 2 — the scan test requests rows explicitly)" }
          $reuseReceipts = (Select-String -Path $engineLog -Pattern "\[plugin\] reuse while playing").Count
          if ($reuseReceipts -lt 1) { throw "engine.log missing the mid-play reuse receipt (same-plugin fast path)" }
          $rejectReceipts = (Select-String -Path $engineLog -Pattern "\[load\] REJECTED while playing").Count
          if ($rejectReceipts -lt 1) { throw "engine.log missing the rolling-transport rejection receipt" }
          # Stage 3c-polish: D1 device-config receipts + F3 session peak.
          $audioReceipts = (Select-String -Path $engineLog -Pattern "\[audio\] opened device=").Count
          if ($audioReceipts -lt 3) { throw "engine.log missing [audio] opened receipts (got $audioReceipts, need 3: tests A+D+E)" }
          $preparedReceipts = (Select-String -Path $engineLog -Pattern "\[plugin\] prepared").Count
          if ($preparedReceipts -lt 3) { throw "engine.log missing [plugin] prepared receipts (got $preparedReceipts, need 3: AboutToStart + 2 async in test D)" }
          $peakReceipts = (Select-String -Path $engineLog -Pattern "session peak").Count
          if ($peakReceipts -lt 3) { throw "engine.log missing session-peak stop receipts (got $peakReceipts, need 3)" }
          # Stage 3c close-out: musical-release stop receipts + resume re-attack counts.
          $releaseReceipts = (Select-String -Path $engineLog -Pattern "\[stop\] transport stop — musical release").Count
          if ($releaseReceipts -lt 3) { throw "engine.log missing musical-release stop receipts (got $releaseReceipts, need 3)" }
          $reattackReceipts = (Select-String -Path $engineLog -Pattern "resume re-attacks: [1-9]").Count
          if ($reattackReceipts -lt 1) { throw "engine.log missing a resume re-attack receipt (straddle handling regressed)" }
          # Stage 3d-1 + milestone 1: editor-window receipts — unavailable
          # (negative: host phase N + the cycle's 10 unload probes), REAL
          # opens (host phase F + the cycle finale — the same instance id
          # re-opens ACROSS reloads by design now; the one-editor-at-a-time
          # invariant is enforced by createEditorIfNeeded + the close-before-
          # retire order), one focus echo per repeat, closes per id.
          $editorNegReceipts = (Select-String -Path $engineLog -Pattern "\[editor\] open refused — no live instance").Count
          if ($editorNegReceipts -lt 10) { throw "engine.log missing the editor_unavailable receipts (got $editorNegReceipts, need >= 10: the cycle's unload probes)" }
          $editorOpenIds = (Select-String -Path $engineLog -Pattern "\[editor\] opened instance=([^\s]+)").Matches | ForEach-Object { $_.Groups[1].Value }
          if ($editorOpenIds.Count -lt 2) { throw "engine.log missing editor-open receipts (got $($editorOpenIds.Count), need >= 2: host phase F + the cycle finale)" }
          $editorFocusReceipts = (Select-String -Path $engineLog -Pattern "\[editor\] focus existing instance=").Count
          if ($editorFocusReceipts -lt 1) { throw "engine.log missing the repeat-open focus receipt" }
          $editorCloseReceipts = (Select-String -Path $engineLog -Pattern "\[editor\] closed instance=").Count
          # M1 deferral contract: the cycle unloads close NO editors (the
          # unload probes answer editor_unavailable — nothing was open), so
          # the closed receipts are the real closes only (phase F + the
          # cycle finale; the per-unload editor-close receipts of the old
          # set-retire machinery are gone, and the >=10 bound returns with
          # multi-instance).
          if ($editorCloseReceipts -lt 2) { throw "engine.log missing the editor close receipts (got $editorCloseReceipts, need >= 2: test D's real closes)" }
          # Stage 3d-3: state persistence receipts — capture triggers (replace
          # from the re-hosts + editor-close + explicit requests) and TWO
          # restores (default round-trip + the diverged embed). The blob size
          # is wrapper-defined (opaque container) — count, don't pin bytes.
          $stateCaptured = (Select-String -Path $engineLog -Pattern "\[plugin\] state captured \d+ bytes").Count
          if ($stateCaptured -lt 4) { throw "engine.log missing state-capture receipts (got $stateCaptured, need 4+)" }
          $stateRestored = (Select-String -Path $engineLog -Pattern "\[plugin\] state restored \d+ bytes").Count
          if ($stateRestored -ne 1) { throw "engine.log must show EXACTLY ONE state restore (the seq-6 diverged embed), got $stateRestored" }
          # Stage 3f-3a: OWNED editor windows — host mode sent the runner's
          # real window handle (setHostWindow), so the parse+store receipt AND
          # the owner-application receipt must both exist. Host mode opens
          # EXACTLY ONE editor (the repeat request RAISES, never re-opens) →
          # exactly ONE applied receipt. Multi mode sends NOTHING, so its two
          # editor opens (inst-a + inst-b) must log the missing-hwnd skip
          # (spec point 4: today's behaviour, but LOGGED).
          $hostWindowSet = (Select-String -Path $engineLog -Pattern "\[editor\] host window set hwnd=0x").Count
          if ($hostWindowSet -lt 1) { throw "3f-3a receipt missing: no '[editor] host window set hwnd=0x' in engine.log" }
          $ownerApplied = (Select-String -Path $engineLog -Pattern "\[editor\] host-owner applied instance=\S+ hwnd=0x").Count
          if ($ownerApplied -lt 2) { throw "3f-3a receipt wrong: host mode must apply the owner per SHOWED window (phase F + the cycle finale), got $ownerApplied '[editor] host-owner applied' receipts" }
          # Stage 3h — re-scoped by milestone 1: the PLUGIN retire queue is
          # gone (the vendor's RenderSequenceExchange frees a removed
          # instance only after the audio thread swapped to the sequence
          # that excludes it — the same never-before-the-proof guarantee,
          # implemented and maintained by JUCE). The SCORE snapshot queue is
          # engine-owned (the dispatch walk reads the raw arrays), so its
          # audio-proof discipline remains CI-asserted: every freed score
          # must show seq >= swapSeq + 2.
          $scoreFrees = Select-String -Path $engineLog -Pattern "\[audio\] score snapshot freed swapSeq=(\d+) seq=(\d+)"
          if ($scoreFrees.Count -lt 1) { throw "engine.log missing 3h score free receipts (got $($scoreFrees.Count), need >= 1 — retired score snapshots must free on the audio proof too)" }
          foreach ($m in $scoreFrees) {
            $s = [uint64]$m.Matches[0].Groups[1].Value
            $q = [uint64]$m.Matches[0].Groups[2].Value
            if ($q -lt ($s + 2)) { throw "3h counter math violated: score snapshot freed at seq $q < swapSeq $s + 2 — a retired score was freed before the audio proof passed" }
          }
          Write-Host "3h proof-based reclamation (milestone 1 scope): $($scoreFrees.Count) score free(s) with seq >= swapSeq + 2 (plugin teardown is the vendor's RenderSequenceExchange now)"
          Write-Host "engine.log receipt assertions passed (scale load, play, load-fail, async init, reuse, rolling-transport reject, audio config, prepare config, session peak, musical release, resume re-attacks, editor unavailable/open=x1/focus/close, state captured/restored, 3f-3a host-window set + owner applied + missing-path skips, 3h retire deferrals + freed counter math all present)"

      - run: npm ci

      - name: Build web (vite)
        run: npm run build

      - name: tsc --noEmit (gate)
        run: npx tsc --noEmit

      # Stage 3f-1: NSIS ONLY (the fresh-install uninstall hook is NSIS-only;
      # MSI cannot express it, so the msi target is dropped entirely).
      - name: Tauri build (nsis + raw exe)
        run: npx tauri build

      # Stage 3f-1 — the fresh-install uninstall hook MUST be present in the
      # generated NSIS script: both delete paths ($LOCALAPPDATA\com.scorch.app
      # and $APPDATA\scorch) and the $UpdateMode guard (an update-mode
      # uninstall must NOT wipe saved data). The real uninstall/reinstall
      # round-trip can only be verified BY HAND on Windows — CI proves the
      # script carries the hook, not the runtime behaviour.
      - name: Verify NSIS uninstall hook (fresh-install hygiene)
        shell: pwsh
        run: |
          # The tauri-bundler does NOT inline the hooks file into the
          # generated installer.nsi — its template emits
          #   !include "<absolute path to installer-hooks.nsh>"
          # and invokes the NSIS_HOOK_* macros via !ifmacrodef (verified
          # against the tauri-v2 bundler template: NSIS_HOOK_POSTUNINSTALL
          # sits in the uninstall section, after $UpdateMode is set from
          # /UPDATE). So the wiring proof and the content proof are TWO
          # different files:
          #   1. the generated installer.nsi must carry the !include line
          #      (the hook is actually wired into THIS build), and
          #   2. the hook file itself must carry both delete paths and the
          #      $UpdateMode guard (the hook does what the stage claims).
          $nsi = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "installer.nsi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nsi) { $nsi = Get-ChildItem -Path "src-tauri/target" -Recurse -Filter "installer.nsi" -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $nsi) { throw "generated installer.nsi not found under src-tauri/target" }
          Write-Host "Generated NSIS script: $($nsi.FullName)"
          $text = Get-Content $nsi.FullName -Raw
          if (-not ($text -match '(?m)!\s*include\s+"[^"]*installer-hooks\.nsh"')) {
            throw "installer.nsi does not !include installer-hooks.nsh — the uninstall hook is not wired into this build"
          }
          Write-Host "installer.nsi wires the hook:!include installer-hooks.nsh present"
          $hookText = Get-Content "src-tauri/installer-hooks.nsh" -Raw
          foreach ($needle in @(
            'RMDir /r "$LOCALAPPDATA\com.scorch.app"',
            'RMDir /r "$APPDATA\scorch"',
            '$UpdateMode != 1'
          )) {
            if (-not $hookText.Contains($needle)) { throw "installer-hooks.nsh missing fresh-install hook fragment: $needle" }
          }
          Write-Host "NSIS uninstall hook verified: both delete paths + UpdateMode guard present"

      - name: Create web-pack zip (manifest + dist/ at root)
        shell: pwsh
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $version = [int]$env:RUN_NUMBER
          $iso = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
          @{ version = $version; minShell = 1; generatedAt = $iso } |
            ConvertTo-Json -Compress |
            Out-File -FilePath manifest.json -Encoding utf8NoBOM
          Compress-Archive -Path dist\*, manifest.json -DestinationPath "web-pack-v$version.zip" -Force
          Write-Host "Created web-pack-v$version.zip"

      - name: Verify web-pack contents
        shell: pwsh
        run: |
          $zip = (Get-ChildItem web-pack-v*.zip)[0].FullName
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          $entries = $archive.Entries | ForEach-Object { $_.FullName }
          $archive.Dispose()
          if ($entries -notcontains "manifest.json") { throw "manifest.json missing from web-pack" }
          if ($entries -notcontains "index.html") { throw "index.html missing from web-pack" }
          Write-Host "web-pack entries: $($entries -join ', ')"
          $tmp = New-Item -ItemType Directory -Path web-pack-verify -Force
          Expand-Archive -Path $zip -DestinationPath $tmp -Force
          Get-Content "$tmp\manifest.json"

      - name: Upload web-pack (hot-swap tier)
        uses: actions/upload-artifact@v4
        with:
          name: web-pack
          path: web-pack-v*.zip
          retention-days: 14

      - name: Upload engine exe (sidecar)
        uses: actions/upload-artifact@v4
        with:
          name: scorch-engine-windows-exe
          path: engine/build/scorch-engine.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: scorch-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload raw scorch.exe
        uses: actions/upload-artifact@v4
        with:
          name: scorch-windows-exe
          path: src-tauri/target/release/scorch.exe
          if-no-files-found: error
          retention-days: 14
