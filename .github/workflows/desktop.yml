name: Desktop (Tauri build, Windows)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "engine/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "index.html"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Stage 3a: build the JUCE engine sidecar BEFORE tauri build, so the
      # exe can be placed in src-tauri/binaries/ for the bundler to pick up.
      # Stage 3b-fix: NO SCORCH_ENGINE_AUDIO=OFF — audio is ALWAYS compiled in.
      # The old compile gate shipped mute installers (the user's by-ear gate
      # failed by construction); headless safety is now runtime-lazy-init.
      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Setup MSVC developer environment
        uses: seanmiddleditch/gha-setup-vsdevenv@v4

      - name: Cache JUCE + IXWebSocket FetchContent
        uses: actions/cache@v4
        with:
          path: engine/build/_fetch
          key: engine-fetch-${{ runner.os }}-${{ hashFiles('engine/CMakeLists.txt') }}
          restore-keys: |
            engine-fetch-${{ runner.os }}-

      - name: Configure + build engine (CMake + MSVC)
        shell: pwsh
        run: |
          cmake -S engine -B engine/build -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          cmake --build engine/build --parallel
          if (-not (Test-Path "engine/build/scorch-engine.exe")) {
            throw "scorch-engine.exe not found after build"
          }
          New-Item -ItemType Directory -Path src-tauri/binaries -Force | Out-Null
          Copy-Item engine/build/scorch-engine.exe src-tauri/binaries/scorch-engine.exe -Force
          Write-Host "Engine exe copied to src-tauri/binaries/"

      - name: Engine standalone protocol test (null-audio + graceful no-device paths)
        shell: pwsh
        run: |
          # Gate-absence proof: the binary itself reports "audio: built-in".
          # A compile-gated (mute) build cannot print this.
          $versionOut = & "engine/build/scorch-engine.exe" --version
          Write-Host "Version output: $versionOut"
          if ($versionOut -notmatch "scorch-engine 0\.1\.0") { throw "Version check failed: $versionOut" }
          if ($versionOut -notmatch "audio: built-in") { throw "Audio compile gate still present — engine reports no audio support" }

          # Test A — --null-audio: JUCE null device, no hardware. The graph runs
          # in real time: transport play SUCCEEDS, state ticks ADVANCE, stop works.
          # Stage 3b polish RESUME contract: play(tick 480) starts at ~480 (NOT 0),
          # stop KEEPS the position, play WITHOUT tick RESUMES from it (NOT 0).
          Write-Host "=== Test A: --null-audio (play(480) -> ticks advance -> stop -> resume -> ticks advance) ==="
          $procA = Start-Process -FilePath "engine/build/scorch-engine.exe" -ArgumentList "--port","9378","--null-audio" -PassThru -NoNewWindow -RedirectStandardOutput "engine-a-stdout.txt" -RedirectStandardError "engine-a-stderr.txt"
          Start-Sleep -Seconds 3
          try {
            if ($procA.HasExited) {
              Write-Host "Engine A exited early (code=$($procA.ExitCode)). stdout:"
              if (Test-Path engine-a-stdout.txt) { Get-Content engine-a-stdout.txt }
              Write-Host "stderr:"
              if (Test-Path engine-a-stderr.txt) { Get-Content engine-a-stderr.txt }
              throw "Engine A process exited before test could connect"
            }
            node .github/scripts/test-engine-protocol.mjs 9378 null-audio
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Engine A stdout:"
              if (Test-Path engine-a-stdout.txt) { Get-Content engine-a-stdout.txt }
              Write-Host "Engine A stderr:"
              if (Test-Path engine-a-stderr.txt) { Get-Content engine-a-stderr.txt }
              throw "Engine A null-audio protocol test failed"
            }
            # Stage 3b polish — stop-is-panic proof from the engine's own stdout:
            # the stop handler reports the voices it killed. Missing line = the
            # panic semantics regressed.
            $killProof = Select-String -Path "engine-a-stdout.txt" -Pattern "voices killed"
            if (-not $killProof) { throw "stop panic-semantics proof missing: 'voices killed' not in engine stdout" }
            Write-Host "Voice-kill proof: $($killProof.Line)"
            $resumeProof = Select-String -Path "engine-a-stdout.txt" -Pattern "transport play from tick"
            if (-not $resumeProof) { throw "resume proof missing: no 'transport play from tick' lines in engine stdout" }
            foreach ($l in $resumeProof.Line) { Write-Host "Resume proof: $l" }
            # shutdown -> clean exit 0. A 0xC0000005 would surface as a
            # negative/negative-hex exit code and fail this check.
            $procA.WaitForExit(10000) | Out-Null
            if (-not $procA.HasExited -or $procA.ExitCode -ne 0) { throw "Engine A did not exit cleanly (code=$($procA.ExitCode))" }
            Write-Host "Engine A clean exit 0"
          } finally {
            Stop-Process -Id $procA.Id -Force -ErrorAction SilentlyContinue
          }

          # Test B — NO flag on a headless runner: lazy audio init finds no
          # device, transport play returns the graceful no_audio_device error
          # (the historical 0xC0000005 crash is now a clean protocol reply),
          # and the engine stays protocol-functional afterwards.
          Write-Host "=== Test B: no flag (play -> graceful no_audio_device error, no crash) ==="
          $procB = Start-Process -FilePath "engine/build/scorch-engine.exe" -ArgumentList "--port","9379" -PassThru -NoNewWindow -RedirectStandardOutput "engine-b-stdout.txt" -RedirectStandardError "engine-b-stderr.txt"
          Start-Sleep -Seconds 3
          try {
            if ($procB.HasExited) {
              Write-Host "Engine B exited early (code=$($procB.ExitCode)). stdout:"
              if (Test-Path engine-b-stdout.txt) { Get-Content engine-b-stdout.txt }
              Write-Host "stderr:"
              if (Test-Path engine-b-stderr.txt) { Get-Content engine-b-stderr.txt }
              throw "Engine B process exited before test could connect"
            }
            node .github/scripts/test-engine-protocol.mjs 9379 no-device
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Engine B stdout:"
              if (Test-Path engine-b-stdout.txt) { Get-Content engine-b-stdout.txt }
              Write-Host "Engine B stderr:"
              if (Test-Path engine-b-stderr.txt) { Get-Content engine-b-stderr.txt }
              throw "Engine B no-device graceful-error test failed"
            }
            $procB.WaitForExit(10000) | Out-Null
            if (-not $procB.HasExited -or $procB.ExitCode -ne 0) { throw "Engine B did not exit cleanly (code=$($procB.ExitCode))" }
            Write-Host "Engine B clean exit 0 (headless crash path is gone)"
          } finally {
            Stop-Process -Id $procB.Id -Force -ErrorAction SilentlyContinue
          }

          Write-Host "All engine protocol tests passed (audio-capable build, graceful headless behavior)"

      - run: npm ci

      - name: Build web (vite)
        run: npm run build

      - name: tsc --noEmit (gate)
        run: npx tsc --noEmit

      - name: Tauri build (msi + nsis + raw exe)
        run: npx tauri build

      - name: Create web-pack zip (manifest + dist/ at root)
        shell: pwsh
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $version = [int]$env:RUN_NUMBER
          $iso = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
          @{ version = $version; minShell = 1; generatedAt = $iso } |
            ConvertTo-Json -Compress |
            Out-File -FilePath manifest.json -Encoding utf8NoBOM
          Compress-Archive -Path dist\*, manifest.json -DestinationPath "web-pack-v$version.zip" -Force
          Write-Host "Created web-pack-v$version.zip"

      - name: Verify web-pack contents
        shell: pwsh
        run: |
          $zip = (Get-ChildItem web-pack-v*.zip)[0].FullName
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          $entries = $archive.Entries | ForEach-Object { $_.FullName }
          $archive.Dispose()
          if ($entries -notcontains "manifest.json") { throw "manifest.json missing from web-pack" }
          if ($entries -notcontains "index.html") { throw "index.html missing from web-pack" }
          Write-Host "web-pack entries: $($entries -join ', ')"
          $tmp = New-Item -ItemType Directory -Path web-pack-verify -Force
          Expand-Archive -Path $zip -DestinationPath $tmp -Force
          Get-Content "$tmp\manifest.json"

      - name: Upload web-pack (hot-swap tier)
        uses: actions/upload-artifact@v4
        with:
          name: web-pack
          path: web-pack-v*.zip
          retention-days: 14

      - name: Upload engine exe (sidecar)
        uses: actions/upload-artifact@v4
        with:
          name: scorch-engine-windows-exe
          path: engine/build/scorch-engine.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: scorch-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: scorch-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload raw scorch.exe
        uses: actions/upload-artifact@v4
        with:
          name: scorch-windows-exe
          path: src-tauri/target/release/scorch.exe
          if-no-files-found: error
          retention-days: 14
